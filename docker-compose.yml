version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./yarn.lock:/app/yarn.lock
      - truyen_chibi_node_modules:/app/node_modules
    networks:
      - truyen-chibi-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=truyen_chibi_local
    volumes:
      - truyen_chibi_mysql_data:/var/lib/mysql
    networks:
      - truyen-chibi-network

  ngrok:
    image: ngrok/ngrok:latest
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN} app:${NGROK_PORT}
    depends_on:
      - app
    networks:
      - truyen-chibi-network

volumes:
  truyen_chibi_mysql_data:
    name: truyen_chibi_mysql_data
  truyen_chibi_node_modules:
    name: truyen_chibi_node_modules

networks:
  truyen-chibi-network:
    driver: bridge 