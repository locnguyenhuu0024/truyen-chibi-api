version: '3.8'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=truyen_chibi_local
      - MYSQL_SSL_MODE=DISABLED
    volumes:
      - truyen_chibi_mysql_data:/var/lib/mysql
      - truyen_chibi_mysql_conf:/etc/mysql/conf.d
      - truyen_chibi_mysql_pid:/var/run/mysqld
    command: --pid-file=/var/run/mysqld/mysqld.pid --user=mysql
    networks:
      - truyen-chibi-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
    volumes:
      - ./:/app
      - truyen_chibi_node_modules:/app/node_modules
    networks:
      - truyen-chibi-network

  ngrok:
    image: ngrok/ngrok:latest
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN} app:${NGROK_PORT}
    depends_on:
      - app
    networks:
      - truyen-chibi-network

volumes:
  truyen_chibi_mysql_data:
    name: truyen_chibi_mysql_data
  truyen_chibi_node_modules:
    name: truyen_chibi_node_modules
  truyen_chibi_mysql_conf:
    name: truyen_chibi_mysql_conf
  truyen_chibi_mysql_pid:
    name: truyen_chibi_mysql_pid

networks:
  truyen-chibi-network:
    driver: bridge 